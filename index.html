<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <title>Burrow</title>
    <script>
      // React 번들보다 먼저 실행되어 첫 페인트 전에 테마를 정한다.
      // 번들에서 정하면 다크 사용자가 새로고침할 때 흰 화면이 번쩍인다(FOUC).
      // 저장 키·값은 app/theme/theme.ts 와 같아야 한다.
      (function () {
        try {
          var saved = localStorage.getItem('burrow-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          // localStorage 가 막힌 환경(시크릿 모드 일부)에서는 :root 기본값(라이트)을 쓴다.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
